[project]
name = "le-wm"
version = "0.1.0"
description = "LeWorldModel: Stable End-to-End Joint-Embedding Predictive Architecture from Pixels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stable-worldmodel[train,env]",
    "stable-pretraining",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "scikit-learn",
    "einops",
    "lightning",
    "pytorch",
    "torchvision",
    "zstandard",
    "huggingface_hub",
    "pytest>=8.3.4",
]

[tool.uv]
managed = true
package = true
